<!-- CRUD LIST -->
    <h1 class="text-success">pratos
    </h1>
    <h2>lista total pratos</h2>
    <!-- Item List -->
    <div id="items-list"> 
    </div>
    <!-- Create Item -->
    <h2 class="text-success">criar prato</h2>
    <div class="rounded-3 border overflow-hidden">
    <table class="table table-hover text-center align-middle mb-0">
        <tr>
        <th><input type="text" id="nome" class="form-control" placeholder="nome"></th>
        <th><select id="tipo" name="tipo" class="form-control">
            <option value="quente">quente</option>
            <option value="salada">salada</option>
            <option value="entrada">entrada</option>
        </select></th>
        <th><textarea id="ingredientes" class="form-control" placeholder="ingredientes"></textarea></th>
        <th><a class="btn btn-warning" id="image" data-toggle="modal" data-target="#uploadmodal">imagem</a></th>        
        <th><a class="btn btn-success" onclick="createItem()">criar</a></th>
    </tr>
    </table>
    </div>

    <!-- Update Item -->
    <h2 class="text-success">editar prato</h2>
    <div class="rounded-3 border overflow-hidden mb-5">
    <table class="table table-hover text-center align-middle mb-0">
        <th><input type="text" id="update_id" class="form-control" placeholder="id" disabled></th>
        <th><input type="text" id="update_nome" class="form-control" placeholder="nome"></th>
        <th><select id="update_tipo" name="update_tipo" class="form-control" disabled>
            <option value="quente">quente</option>
            <option value="salada">salada</option>
            <option value="entrada">entrada</option>
        </select></th>
        <th><textarea id="update_ingredientes" class="form-control" placeholder="ingredientes"></textarea></th>
        <th><a class="btn btn-warning" id="update_image" data-toggle="modal" data-target="#uploadmodal">imagem</a></th>
        <th><a class="btn btn-success" onclick="updateItem()">editar</a></th>
    </table>
</div>


    <div id="uploadmodal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Selecione a imagem</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="drop-area" class="my-3 border-success">
                        <p>Arraste a imagem ou <b>clique para selecionar</b></p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                        <img id="preview" src="#" alt="" class="img-thumbnail mt-3" style="display:none; max-width: 200px;">
                    </div>
                    <div id="status" class="mt-3 text-center"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Ok</button>
                </div>
            </div>
        </div>
    </div>



<script src="./js/crud_pratos.js"></script>
