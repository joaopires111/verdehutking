<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdeHut LOGIN</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />

    <link href="./css/styles.css" rel="stylesheet">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <script src="./js/three/jquery-3.5.1.min.js"></script>
    <script src="./js/three/popper.min.js"></script>
    <script src="./js/three/bootstrap.min.js"></script>
</head>

<body class=" d-flex flex-column align-items-center text-center">
<style>
    body{
  background-image: url('assets/img/rosa.jpg');
}
</style>
<img src="assets\img\so texto verde hut.png" class="mt-5 img-fluid" alt="verdehutlogo" width="25%" height="25%">
<h2 class="text-success mt-1 mb-5">ADMINISTRADOR</h2>

<h2 class="mb-3">Acesso a área restrita</h2>
<div class="col-3 d-flex flex-column">
    <input type="text" class="form-control mb-3" id="login" placeholder="nome de utilizador">
    <input type="password" class="form-control mb-3" id="password" placeholder="palavra-passe">
    <h5 id="imgwarning" class="text-danger mt-3" hidden>Utilizador ou senha incorretos !</h5>
    <button id="login_button" class="btn btn-success" onclick="loginbutton()">Entrar</button>
</div>



<script src="./js/login.js"></script>
</body>
</html>
